    - items.json: node <skill-dir>/scripts/build-items.mjs feedback.json > items.json (exit 0)
    - git-diff-origin-main.diff: git diff origin/main...HEAD -- src/cache.js
    - git-log-oneline.txt: git log --oneline -- src/cache.js

