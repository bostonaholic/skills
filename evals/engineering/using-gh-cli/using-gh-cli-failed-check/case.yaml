    @@ -1,13 +1,24 @@
     class ResponseCache
    +  # Matches the pricing API's signature rotation interval.
    +  TTL_SECONDS = 300
    +
       def initialize
         @entries = {}
       end

       def read(path)
    -    @entries[path]
    +    entry = @entries[path]
