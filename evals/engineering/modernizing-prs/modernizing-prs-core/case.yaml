    ```text
    diff --git a/src/pricing/cache.ts b/src/pricing/cache.ts
    deleted file mode 100644
    index 4b6d8e0..0000000
    --- a/src/pricing/cache.ts
    +++ /dev/null
    @@ -1,11 +0,0 @@
    -export class PricingCache {
    -  private readonly entries = new Map<string, number>();
    -
    -  get(sku: string): number | undefined {
    -    return this.entries.get(sku);
    -  }
