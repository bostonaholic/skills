    gh-pr-view-42.txt:
    ```text
    title:	Reject forged order webhooks
    state:	OPEN
    author:	acme-bot
    labels:	security
    assignees:	acme-bot
    reviewers:	acme/payments (Requested)
    projects:	Shop roadmap (In review)
    milestone:	2026-Q4
    number:	42
    url:	https://github.acme.invalid/acme/shop/pull/42
    additions:	28
    deletions:	0
    auto-merge:	disabled
    --
    Anyone who knows the order webhook URL can post a status update for any order today, and we apply it. That is how ord_1001 was marked paid with no payment behind it in #311. The payment partner already sends a verification header with every request; this PR checks it and rejects requests that fail the check.

    Closes #311
    ```

    gh-pr-diff-42.diff:
    ```text
    diff --git a/app/controllers/webhooks/orders_controller.rb b/app/controllers/webhooks/orders_controller.rb
    index 3a1f2c4..8d9e0b7 100644
    --- a/app/controllers/webhooks/orders_controller.rb
    +++ b/app/controllers/webhooks/orders_controller.rb
    @@ -1,11 +1,20 @@
     module Webhooks
       class OrdersController < ApplicationController
         skip_forgery_protection
    +    before_action :verify_signature!

         def create
           order = Order.find_by!(external_id: params.require(:order_id))
           order.update!(status: params.require(:status))
           head :ok
         end
    +
    +    private
    +
    +    def verify_signature!
    +      expected = OpenSSL::HMAC.hexdigest("SHA256", Rails.application.credentials.partner_webhook_secret, request.raw_post)
    +      given = request.headers["X-Acme-Signature"].to_s
    +      head :unauthorized unless ActiveSupport::SecurityUtils.secure_compare(expected, given)
    +    end
       end
     end
    diff --git a/test/controllers/webhooks/orders_controller_test.rb b/test/controllers/webhooks/orders_controller_test.rb
    new file mode 100644
    index 0000000..5c6d7e8
    --- /dev/null
    +++ b/test/controllers/webhooks/orders_controller_test.rb
    @@ -0,0 +1,19 @@
    +require "test_helper"
    +
    +class Webhooks::OrdersControllerTest < ActionDispatch::IntegrationTest
    +  BODY = { order_id: "ord_1001", status: "paid" }.to_json
    +
    +  test "rejects an order webhook without a valid signature" do
    +    post webhooks_orders_path, params: BODY, headers: { "Content-Type" => "application/json", "X-Acme-Signature" => "bogus" }
    +    assert_response :unauthorized
    +    assert_equal "pending", orders(:ord_1001).reload.status
    +  end
    +
    +  test "applies an order webhook with a valid signature" do
    +    secret = Rails.application.credentials.partner_webhook_secret
    +    signature = OpenSSL::HMAC.hexdigest("SHA256", secret, BODY)
    +    post webhooks_orders_path, params: BODY, headers: { "Content-Type" => "application/json", "X-Acme-Signature" => signature }
    +    assert_response :ok
    +    assert_equal "paid", orders(:ord_1001).reload.status
    +  end
    +end
