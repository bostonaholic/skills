    diff --git a/src/pricing/quote.ts b/src/pricing/quote.ts
    index 2c4e6a8..5e7a9c1 100644
    --- a/src/pricing/quote.ts
    +++ b/src/pricing/quote.ts
    @@ -1,5 +1,5 @@
    -import { PricingCache } from "./cache";
    +import { PricingStore } from "./store";

    -const cache = new PricingCache();
    +const cache = new PricingStore();

     export function quote(sku: string, fetchPrice: (sku: string) => number): number {
    diff --git a/src/pricing/store.ts b/src/pricing/store.ts
    new file mode 100644
    index 0000000..7a9c1e3
    --- /dev/null
    +++ b/src/pricing/store.ts
    @@ -0,0 +1,27 @@
    +const DEFAULT_MAX_AGE_MS = 5 * 60 * 1000;
    +
    +interface StoredPrice {
    +  price: number;
    +  expiresAt: number;
    +}
    +
    +// Holds quoted prices and drops each one once it is older than maxAgeMs.
    +export class PricingStore {
    +  private readonly prices = new Map<string, StoredPrice>();
    +
    +  constructor(private readonly maxAgeMs: number = DEFAULT_MAX_AGE_MS) {}
    +
    +  get(sku: string): number | undefined {
    +    const stored = this.prices.get(sku);
    +    if (stored === undefined) return undefined;
    +    if (Date.now() >= stored.expiresAt) {
    +      this.prices.delete(sku);
    +      return undefined;
    +    }
    +    return stored.price;
    +  }
    +
    +  set(sku: string, price: number): void {
    +    this.prices.set(sku, { price, expiresAt: Date.now() + this.maxAgeMs });
    +  }
    +}
