     export class PricingCache {
    -  private readonly entries = new Map<string, number>();
    +  private readonly entries = new Map<string, { price: number; storedAt: number }>();
    +
    +  constructor(private readonly options: PricingCacheOptions = { cacheTtl: 300_000 }) {}

       get(sku: string): number | undefined {
